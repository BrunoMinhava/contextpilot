name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node src/cli.js doctor
      - run: npm run benchmark
      - run: npm pack
      - run: npm run test:package
      - run: node scripts/checksum.js
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            contextpilot-mcp-*.tgz
            SHA256SUMS
